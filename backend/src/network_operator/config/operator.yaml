# Рабочие значения оператора сети кредиторов. Секреты и адреса — только из окружения (OPERATOR_).
# Значения — предложено, ждут согласования с владельцем; обоснование — рядом.
version: operator-config-1

oprf:
  # Активная версия ключа на тип идентификатора: ключ = DeriveKeyPair(seed, "anora-nazar:<тип>:<версия>").
  # Ротация — новая версия: токены старой и новой версии не совпадают, кредиторы токенизируют заново.
  key_versions: {pinfl: 1, phone: 1, device: 1, card: 1, supplier_inn: 1}   # предложено: первая версия

counters:
  # Окно каждого счётчика. Имя счётчика фиксирует окно (network-contract-1): значение обязано совпасть с именем,
  # смена окна — новая версия контракта. Окна — из Блока 3 (серия по ПИНФЛ 1 ч и 7 дней, связи 24 ч и 30 дней).
  windows:
    pinfl_lenders_1h: 1h
    pinfl_lenders_7d: 7d
    phone_people_24h: 24h
    phone_people_30d: 30d
    device_people_30d: 30d
    card_borrowers_30d: 30d
    card_lenders_30d: 30d
    supplier_borrowers_30d: 30d
    supplier_lenders_30d: 30d

quotas:
  # Квота OPRF кредитора в контуре: вычислений за скользящее окно ≤ reserve + per_application × заявок за окно.
  window_seconds: 3600            # предложено: час — перебор номеров виден быстро, честная пачка заявок укладывается
  reserve: 100                    # предложено: ~20 заявок по 5 типов идентификаторов до прихода их событий (пачка сценария)
  per_application: 10             # предложено: до 5 типов у заявки, карта на Т3 и новые версии — с запасом вдвое

watches:
  max_seconds: 604800             # предложено: 7 дней — самый долгий срок годности оценки (программы, policy-v3)

notifications:
  tick_seconds: 1                 # предложено: уведомление доходит до узла за секунды — главный сценарий через сеть
  batch_size: 100                 # предложено
  retry_seconds: 5                # предложено: пауза перед повтором доставки
  max_attempts: 120               # предложено: 10 минут повторов — переживает перезапуск узла
  timeout_seconds: 5              # предложено: как у вызовов между сервисами стенда

database:
  pool_size: 10
