# СТАТУС: предложено, ждёт согласования владельцем.
# Каталог текстов узла: подписи и формулировки по кодам (Блок 5, «Заёмщику — общая причина, сотруднику — полная»).
# Версия неизменна: правка текстов — новый файл с новой версией.
# Каждый текст — словарь по языкам {ru: "..."}; узбекский (латиница) — ключ uz здесь и в languages.
# Заёмщику: без названия признака и без слов «AI», «скоринг», «модель»; пауза — обычная защита, а не обвинение.
version: texts-v1
languages: [ru]
default_language: ru

# Заёмщику — общие формулировки: одна на группу причин (якоря &client_*), чтобы по экрану нельзя было выучить обход.
reasons:
  # обязательные правила № 3759: заёмщику — понятная причина остановки
  MANDATORY_SELF_BAN:
    staff_title: {ru: "Действует самозапрет"}
    staff_explanation: {ru: "Бюро вернуло активный самозапрет на кредиты (п. 18). Процесс остановлен по норме, узел только записал факт. Продолжить заявку нельзя."}
    client_template: {ru: "На ваше имя действует самозапрет на получение кредитов, поэтому оформить кредит нельзя."}
  MANDATORY_BUREAU_BLOCKED:
    staff_title: {ru: "Бюро не принимает запрос"}
    staff_explanation: {ru: "Бюро ответило «заблокировано» или «занято»: после недавней выдачи другие кредиторы закрыты на время очереди (п. 19–20). Процесс остановлен по норме. Сам ответ не доказывает мошенничество."}
    client_template: {ru: "Кредитное бюро временно не принимает новые заявки на ваше имя. Попробуйте позже."}
  MANDATORY_BIOMETRY_FAILED:
    staff_title: {ru: "Биометрия не пройдена"}
    staff_explanation: {ru: "Проверка лица с liveness не подтвердила владельца (п. 6, 23). Процесс остановлен по норме; повтор — по правилам банка."}
    client_template: {ru: "Не удалось подтвердить вашу личность по биометрии, поэтому оформление остановлено."}
  MANDATORY_PHONE_NOT_OWNED:
    staff_title: {ru: "Телефон не принадлежит клиенту"}
    staff_explanation: {ru: "Номер в заявке не зарегистрирован на ПИНФЛ заявителя (п. 5). Процесс остановлен по норме."}
    client_template: {ru: "Номер телефона в заявке не зарегистрирован на ваше имя, поэтому оформление остановлено."}

  # правила продукта
  PRODUCT_CONFIRMED_CASE_IDENTIFIER:
    staff_title: {ru: "Идентификатор из подтверждённого дела"}
    staff_explanation: {ru: "Телефон, устройство, карта или ИНН заявки есть в закрытом деле из стоп-листа банка. Это повод для проверки, а не отказ: заявитель может быть жертвой. Проверьте, что совпало, исход того дела и роль в нём."}
    client_template: &client_links {ru: "Заявке нужна дополнительная проверка банком. Это обычная мера защиты."}
  PRODUCT_CLIENT_REPORTED_PRESSURE:
    staff_title: {ru: "Клиент сообщил о давлении"}
    staff_explanation: {ru: "Клиент нажал «Меня просят взять кредит». Заявка ждёт звонка. Звоните по номеру из госреестра, а не из заявки; начните с вопросов вне сценария мошенника."}
    client_template: &client_pause {ru: "Мы приостановили оформление, чтобы защитить ваши деньги. Это обычная мера защиты."}  # сигнал уходит молча: экран не выдаёт его тому, кто стоит рядом
  PRODUCT_PRICE_ABOVE_MARKET:
    staff_title: {ru: "Цена выше рынка"}
    staff_explanation: {ru: "Цена за единицу заметно выше сравнимых покупок: тот же товар, единица, комплектация, район, период. Запросите вторую смету или другого поставщика."}
    client_template: &client_project {ru: "Банк дополнительно проверяет условия заявки. Это обычная мера защиты."}

  # граф
  GRAPH_RARE_SHARED_LINKS:
    staff_title: {ru: "Редкие общие связи с другими заявителями"}
    staff_explanation: {ru: "С другими заявителями есть несколько независимых редких общих связей: телефон, устройство, адрес, работодатель. Частые атрибуты группу не образуют. Проверьте связи на графе и безобидные объяснения: семья, зарплатный проект."}
    client_template: *client_links
  GRAPH_GROUP_BURST:
    staff_title: {ru: "Всплеск заявок группы"}
    staff_explanation: {ru: "Связанная группа подала за короткое окно заметно больше заявок, чем обычно в филиале. Сравните даты заявок, сотрудников и поставщиков группы."}
    client_template: *client_links
  GRAPH_GROUP_SHARED_ROLE:
    staff_title: {ru: "Общий сотрудник или поставщик в группе"}
    staff_explanation: {ru: "Заявки связанной группы оформлял один сотрудник или в них один поставщик. Само по себе это не основание для отказа. Проверьте нагрузку сотрудника и историю поставщика."}
    client_template: *client_links
  GRAPH_PROXIMITY_TO_CASE:
    staff_title: {ru: "Рядом с подтверждённым делом"}
    staff_explanation: {ru: "Заявка в нескольких шагах по редким связям от заявки из подтверждённого дела. Близость по цепочке меткой не становится. Проверьте путь на графе и роль каждого звена."}
    client_template: *client_links
  GRAPH_COORDINATION_CLUSTER:
    staff_title: {ru: "Группа координации"}
    staff_explanation: {ru: "Через одну роль — сотрудника, помощника хокима или поставщика — прошло за окно заметно больше заявок, чем в её обычном темпе. Группа направляет на проверку, но не даёт отказа. Проверьте каждую заявку независимо."}
    client_template: *client_links

  # зона 1: воля заёмщика
  F1_ACCESS_RECOVERY_BEFORE_APPLICATION:
    staff_title: {ru: "Восстановление доступа перед заявкой"}
    staff_explanation: {ru: "Незадолго до заявки восстанавливали доступ или меняли пароль — так бывает, когда приложением управляет другой человек. Сверьте время в событиях сессии; на звонке спросите, кто восстанавливал доступ."}
    client_template: &client_will {ru: "Нужно убедиться, что заявку оформляете вы сами и по своему желанию."}
  F1_NEW_DEVICE:
    staff_title: {ru: "Новое устройство"}
    staff_explanation: {ru: "Заявка подана с устройства, которым клиент пользуется недавно. Проверьте, была ли смена телефона и есть ли другие сигналы в сессии."}
    client_template: *client_will
  F1_DEVICE_SHARED_BY_CLIENTS:
    staff_title: {ru: "Одно устройство у разных клиентов"}
    staff_explanation: {ru: "С этого устройства недавно входили разные клиенты (п. 38). Проверьте, не семейное ли устройство, и нет ли с него других заявок."}
    client_template: *client_will
  F1_REMOTE_CONTROL_OR_CALL:
    staff_title: {ru: "Звонок или удалённое управление в сессии"}
    staff_explanation: {ru: "Сессионный антифрод отметил звонок или удалённый доступ во время заявки (п. 15). На звонке спросите, не подсказывал ли кто-то, что нажимать."}
    client_template: *client_will
  F1_AMOUNT_VS_SPENDING:
    staff_title: {ru: "Сумма нетипична для трат клиента"}
    staff_explanation: {ru: "Сумма кредита заметно больше обычных месячных трат по карте. Слабый сигнал, учитывается в сочетании. Спросите о цели кредита."}
    client_template: *client_will
  F1_FIRST_CREDIT:
    staff_title: {ru: "Первый кредит"}
    staff_explanation: {ru: "Кредитной истории нет. Слабый сигнал, только в сочетании: у жертвы чистая история и нетипичный первый онлайн-кредит рискованнее."}
    client_template: *client_will
  F1_SELF_BAN_RECENTLY_LIFTED:
    staff_title: {ru: "Самозапрет снят недавно"}
    staff_explanation: {ru: "Самозапрет сняли незадолго до заявки — так бывает, когда его снимают под диктовку. Спросите, зачем снимали запрет и кто это предложил."}
    client_template: *client_will
  F1_BUREAU_LOCK_CONTEXT:
    staff_title: {ru: "Блокировка бюро в контексте"}
    staff_explanation: {ru: "Бюро недавно отвечало «заблокировано» или «занято» по этому ПИНФЛ. Ответ процессуальный и сам уровень не поднимает. Проверьте, не было ли серии заявок у других кредиторов."}
    client_template: *client_will
  F1_NIGHT_APPLICATION:
    staff_title: {ru: "Ночная заявка"}
    staff_explanation: {ru: "Заявка подана ночью по местному времени, что нетипично для клиента. Слабый сигнал, только в сочетании."}
    client_template: *client_will
  F1_FILL_SPEED:
    staff_title: {ru: "Скорость заполнения формы"}
    staff_explanation: {ru: "Форму заполнили очень быстро или вставкой текста. Автозаполнение даёт ту же скорость, поэтому сигнал слабый. Сверьте с другими событиями сессии."}
    client_template: *client_will
  F1_FIRST_TRANSFER_CREDIT_SHARE:
    staff_title: {ru: "Крупный первый перевод кредитных денег"}
    staff_explanation: {ru: "В первые часы после зачисления большая доля кредита уходит переводом (п. 37). Узел рекомендует, решает транзакционный антифрод банка. Подтвердите перевод у клиента по независимому каналу."}
    client_template: &client_transfer {ru: "Нужно убедиться, что перевод делаете вы сами и по своему желанию."}
  F1_NEW_RECIPIENT:
    staff_title: {ru: "Новый получатель"}
    staff_explanation: {ru: "Клиент впервые переводит деньги на эту карту. Вместе с крупной долей кредита в переводе — повод подтвердить перевод у клиента."}
    client_template: *client_transfer

  # сеть кредиторов
  NET_PINFL_QUERIED_BY_LENDERS:
    staff_title: {ru: "Запросы других кредиторов по ПИНФЛ"}
    staff_explanation: {ru: "За короткое время ПИНФЛ запрашивали несколько кредиторов сети — похоже на серию заявок за вечер. Проверьте счётчики сети и спросите клиента о других заявках."}
    client_template: *client_will
  NET_PHONE_SHARED_ACROSS_PEOPLE:
    staff_title: {ru: "Телефон у разных людей в сети"}
    staff_explanation: {ru: "У других кредиторов этот телефон указан у разных людей. Проверьте, не семейный ли это номер, и совпадения внутри банка."}
    client_template: *client_links
  NET_DEVICE_SHARED_ACROSS_PEOPLE:
    staff_title: {ru: "Устройство у разных людей в сети"}
    staff_explanation: {ru: "У других кредиторов с этого устройства подавали заявки разные люди. Проверьте совпадения внутри банка и другие сигналы группы."}
    client_template: *client_links
  NET_RECIPIENT_CARD_LINKED:
    staff_title: {ru: "Карта-получатель связана с другими заёмщиками"}
    staff_explanation: {ru: "Карта получателя в сети встречается у других заёмщиков или в подтверждённом деле. Перевод стоит задержать до подтверждения клиентом по независимому каналу."}
    client_template: *client_transfer
  NET_CONFIRMED_CASE_MATCH:
    staff_title: {ru: "Совпадение с делом в сети"}
    staff_explanation: {ru: "Токен заявки совпал с подтверждённым делом другого кредитора. Это не отказ: заявитель может быть жертвой. Совместное дело — через оператора сети."}
    client_template: *client_links
  NET_SUPPLIER_CONCENTRATION:
    staff_title: {ru: "Концентрация на поставщике в сети"}
    staff_explanation: {ru: "У других кредиторов на этого поставщика приходится нетипично большая доля программных займов. Сверьте с концентрацией в своём банке и историей поставщика."}
    client_template: *client_project
  NET_SERIAL_REPEAT:
    staff_title: {ru: "Повтор серийного номера или счёта"}
    staff_explanation: {ru: "Серийный номер товара или счёт уже встречался у другого кредитора. Проверьте, не продают ли один предмет дважды; запросите документы поставки."}
    client_template: *client_project

  # зона 3: суть проекта
  F3_PRICE_ABOVE_COMPARABLES:
    staff_title: {ru: "Цена выше сравнимых покупок"}
    staff_explanation: {ru: "Цена за единицу выше медианы сравнимых договоров. Проверьте уровень сравнения, комплектацию и что входит в цену; запросите вторую смету."}
    client_template: *client_project
  F3_SUPPLIER_NEW:
    staff_title: {ru: "Поставщик-новичок"}
    staff_explanation: {ru: "Поставщик зарегистрирован недавно. Само по себе не основание; проверьте реестр недобросовестных поставщиков и связи с помощником или сотрудником."}
    client_template: *client_project
  F3_SUPPLIER_CONCENTRATION:
    staff_title: {ru: "Концентрация на поставщике"}
    staff_explanation: {ru: "Доля программных займов филиала у этого поставщика заметно выше обычной для категории. Сравните с другими филиалами и выборочно проверьте поставки."}
    client_template: *client_project
  F3_EMPLOYEE_CONCENTRATION:
    staff_title: {ru: "Концентрация на сотруднике"}
    staff_explanation: {ru: "Сотрудник оформил заметно больше заявок, чем его обычная нагрузка и коллеги, или его заявки чаще в связанных группах. Решает не филиал; при подтверждении — служба безопасности."}
    client_template: *client_project
  F3_HELPER_RECOMMENDATION_BURST:
    staff_title: {ru: "Всплеск рекомендаций помощника"}
    staff_explanation: {ru: "Помощник хокима дал за окно заметно больше рекомендаций, чем в своём темпе, или многие из них на одного поставщика. Позвоните заёмщикам по номерам, не зависящим от филиала."}
    client_template: *client_project
  F3_APPLICANT_OUTSIDE_HELPER_MAHALLA:
    staff_title: {ru: "Заявитель не из махалли помощника"}
    staff_explanation: {ru: "Прописка заявителя не совпадает с махаллей помощника, который дал рекомендацию. Проверьте основание рекомендации."}
    client_template: *client_project
  F3_APPLICANT_IS_STAFF:
    staff_title: {ru: "Заявитель — сотрудник банка или госоргана"}
    staff_explanation: {ru: "Заявитель есть в кадровом списке банка или работает в госоргане. Проверьте право на программу и конфликт интересов."}
    client_template: *client_project
  F3_BATCH_ACCEPTANCE_ACTS:
    staff_title: {ru: "Пакет актов приёмки"}
    staff_explanation: {ru: "Один подписант подписал много актов приёмки за день. До оплаты поставщику нужно независимое подтверждение поставки: звонок заёмщику, фото с геометкой, ветеринарный учёт."}
    client_template: *client_project
  F3_INCOME_JUMP:
    staff_title: {ru: "Скачок дохода"}
    staff_explanation: {ru: "Взносы в ИНПС резко выросли незадолго до заявки. Заключение — «доход не подтверждён» с рядом взносов; лимит определяет кредитная политика банка."}
    client_template: *client_project
  F3_VOLUNTARY_CONTRIBUTIONS_SHARE:
    staff_title: {ru: "Доля добровольных взносов"}
    staff_explanation: {ru: "Заметная часть взносов в ИНПС — добровольные: так доход могут поднять перед заявкой. Посмотрите ряд взносов по месяцам."}
    client_template: *client_project
  F3_NEW_EMPLOYER_HIRING_SURGE:
    staff_title: {ru: "Работодатель-новичок со всплеском найма"}
    staff_explanation: {ru: "Работодатель недавно зарегистрирован или резко нарастил численность, и от него одновременно пришли заявители со скачком дохода. Проверьте работодателя и состав этой группы заявителей."}
    client_template: *client_project
  F3_DOUBLE_COLLATERAL:
    staff_title: {ru: "Двойной залог"}
    staff_explanation: {ru: "Предмет залога уже есть в реестре залогов. Запросите выписку реестра и сведения о первом залогодержателе."}
    client_template: *client_project

  # модели: какие признаки дали вклад — в доказательствах причины
  MODEL_F1_RISK:
    staff_title: {ru: "Высокий риск воздействия на заёмщика"}
    staff_explanation: {ru: "Модель зоны 1 оценила риск того, что заявку подают под давлением, выше порога. Вклад признаков — в доказательствах. Модель направляет на проверку, решает человек."}
    client_template: *client_will
  MODEL_F2_RISK:
    staff_title: {ru: "Высокий риск связанной схемы"}
    staff_explanation: {ru: "Модель зоны 2 оценила риск того, что заявка входит в связанную схему, выше порога. Вклад признаков — в доказательствах. Модель направляет на проверку, решает человек."}
    client_template: *client_links
  MODEL_F3_RISK:
    staff_title: {ru: "Высокий риск по сути проекта"}
    staff_explanation: {ru: "Модель зоны 3 оценила риск по цене, концентрациям и доходу выше порога. Вклад признаков — в доказательствах. Модель направляет на проверку, решает человек."}
    client_template: *client_project

  # состояние источников и моделей
  SYSTEM_NO_MODEL:
    staff_title: {ru: "Решение без модели"}
    staff_explanation: {ru: "Модель не запущена: её нет, она недоступна или её контракт признаков не совпадает с набором. Решение принято по правилам, графу и сети, балла нет."}
    client_template: &client_routine {ru: "Заявка проходит обычную проверку банка."}
  SYSTEM_NETWORK_UNAVAILABLE:
    staff_title: {ru: "Сеть недоступна"}
    staff_explanation: {ru: "Сеть кредиторов не ответила или выключена. Решение принято по внутренним признакам; до зачисления запрос повторяется."}
    client_template: &client_delay {ru: "Часть сведений ещё не получена, поэтому проверка займёт больше времени."}
  SYSTEM_SOURCE_UNAVAILABLE:
    staff_title: {ru: "Источник данных не ответил"}
    staff_explanation: {ru: "Не ответили один или несколько источников: бюро, ИНПС, карты, реестры. Нет данных — не риск и не «чисто»; какие источники молчат — в доказательствах."}
    client_template: *client_delay
  SYSTEM_INCOME_NOT_CONFIRMED:
    staff_title: {ru: "Доход не подтверждён"}
    staff_explanation: {ru: "Нет данных ИНПС или МИП, правдоподобие дохода не оценено. Кредитный эксперт видит «доход не подтверждён»; лимит определяет кредитная политика банка."}
    client_template: {ru: "Банку нужно дополнительно подтвердить сведения по заявке."}
  SYSTEM_PRICE_NOT_CHECKED:
    staff_title: {ru: "Цена не проверена"}
    staff_explanation: {ru: "Сравнимых договоров мало даже по широкой группе, поэтому цена не проверена и сигнала нет. При сомнениях запросите вторую смету."}
    client_template: *client_project

# названия признаков — для вклада признаков у риск-менеджера; заёмщику не выдаются
