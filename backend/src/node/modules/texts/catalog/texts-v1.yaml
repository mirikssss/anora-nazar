    text: {ru: "Деньги нужны лично вам или вашей семье?"}
    answers:
      yes_own: {ru: "Да, мне или семье"}
      no_other_person: {ru: "Нет, другому человеку"}
  someone_instructs:
    text: {ru: "Кто-нибудь сейчас подсказывает вам, что нажимать, или просил оформить кредит?"}
    answers:
      no_one: {ru: "Нет, никто"}
      yes_someone: {ru: "Да, подсказывают или просили"}

# рекомендация узла по первому переводу (Т3); решает транзакционный антифрод банка
transfer_actions:
  allow:
    title: {ru: "Пропустить"}
    description: {ru: "Узел не возражает против перевода."}
    client_message: {ru: "Перевод отправлен."}
  hold_until_confirmed:
    title: {ru: "Задержать до подтверждения"}
    description: {ru: "Задержать перевод, пока клиент не подтвердит его по независимому каналу (п. 37)."}
    client_message: {ru: "Перевод задержан для проверки безопасности, банк свяжется с вами. Если вам сейчас звонят от имени банка и просят перевести деньги — положите трубку."}

client_screens:
  approved:
    title: {ru: "Заявка одобрена"}
    body: {ru: "Ознакомьтесь с условиями, подпишите договор и подтвердите личность по биометрии. После этого деньги поступят на счёт."}
    buttons:
      continue: {ru: "Продолжить"}
  intent_check:
    title: {ru: "Два вопроса перед выдачей"}
    body: {ru: "Это обычная проверка безопасности. Ответьте кнопками — это займёт меньше минуты."}
    buttons:
      continue: {ru: "Продолжить"}
      postpone: {ru: "Отложить"}
      someone_asks: {ru: "Меня просят взять кредит"}
  pause:
    title: {ru: "Заявка на паузе"}
    body: {ru: "Мы приостановили оформление, чтобы защитить ваши деньги. Так банк поступает с частью заявок — это обычная мера защиты. В течение рабочего дня вам позвонит сотрудник банка. Он не попросит код из СМС и не попросит перевести деньги."}
    warning: {ru: "Если вам сейчас звонят от имени банка — положите трубку."}
    buttons:
      ok: {ru: "Понятно"}
  under_review:
    title: {ru: "Заявка на проверке"}
    body: {ru: "Банк позвонит вам в течение рабочего дня. До звонка деньги не выдаются, делать ничего не нужно."}
    warning: {ru: "Если вам сейчас звонят от имени банка — положите трубку."}
    buttons:
      ok: {ru: "Понятно"}
      cancel_application: {ru: "Отменить заявку"}
  stopped:
    title: {ru: "Оформление остановлено"}
    body: {ru: "Продолжить оформление нельзя по требованиям законодательства. Причина указана ниже."}
    buttons:
      ok: {ru: "Понятно"}
  cancelled:
    title: {ru: "Заявка отменена"}
    body: {ru: "Деньги не выданы, обязательств по этой заявке у вас нет. Если кредит понадобится, подайте новую заявку."}
    buttons:
      ok: {ru: "Понятно"}
