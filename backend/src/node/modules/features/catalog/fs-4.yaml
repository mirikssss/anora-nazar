# Набор признаков fs-4 (fs-3 + признаки сети кредиторов: счётчики оператора по чужим кредиторам, И4).
# Параметры определений те же, что в fs-3; окна признаков сети задаёт контракт network-contract-1.
# Правка — новый файл с новой версией: версия набора входит в контракт моделей.
version: fs-4
timezone: Asia/Tashkent           # местное время для «ночной заявки»

zone1:
  night_hours: [0, 6]             # [с, до) по местному времени
  spending_months: 6              # Блок 3: медиана трат за 6 месяцев
  device_shared_window_days: 30   # Блок 3: разные ПИНФЛ на устройстве за 30 дней

zone2:
  cohort_window_days: 10          # состав группы координации за окно всплеска (Блок 3: 10 дней)

zone3:
  pricing:
    min_comparables: 20           # Блок 3: меньше 20 договоров — шире по области
    robust_z_flag: 3.5            # Блок 3: флаг при |z| > 3,5
    mad_scale: 1.4826             # MAD → σ нормального распределения
    min_log_mad: 0.01             # нижняя граница MAD на лог-шкале
    levels:                       # район за 90 дней → страна за 90 дней → страна за год
      - {scope: district, days: 90}
      - {scope: country, days: 90}
      - {scope: country, days: 365}
  income:
    recent_months: 3              # Блок 3: медиана за 3 месяца
    baseline_months: 12           # Блок 3: против предыдущих 12
    cusum_k: 0.5                  # допуск CUSUM в σ
    cusum_h: 4.0                  # порог аларма в σ
    sigma_floor_share: 0.05       # σ не меньше 5 % медианы (взносы часто постоянны)
  concentration:
    window_days: 90               # Блок 3: доля за 90 дней
    prior_weight: 20              # вес априорной доли в m-оценке (в заявках)
    prior_windows: 2              # вес априорного темпа помощника (в окнах)
  helper_burst_window_days: 10    # Блок 3: рекомендаций за 10 дней
  employer_cohort_days: 30        # заявители одного работодателя с одновременным скачком дохода
