# Политика решений v2: policy-v1 + глубина обхода, группа координации, источник «модель» (И2, ревью C и E).
# Значения v1 согласованы с владельцем 11.10.2026; новые разделы — СТАТУС: предложено, ждут согласования.
# Версия неизменна: правка — новый файл с новой версией; запись решения хранит версию и хеш файла.
version: policy-v2
reasons_version: reasons-v2

assessment_validity:
  online: {hours: 24}     # окно очереди бюро, № 3759 п. 20
  program: {days: 7}      # выезд и заключение — до 5 рабочих дней

index:
  window_days: 90         # размер группы за 90 дней (Блок 3)
  identity_kinds: [phone, device, address, employer]
  hub_thresholds:         # больше этого числа разных людей — шумный хаб, группу не образует
    phone: 10
    device: 10
    address: 30
    employer: 50
  marking_kinds: [pinfl, phone, device, address, employer]
  max_hops: 3             # предложено: глубина обхода от заявки по редким связям (SPEC.md)

group:
  min_independent_rare_links: 2
  burst:
    window_days: 10
    min_applications: 5
    min_ratio_to_background: 3
  red_when:
    min_independent_rare_links: 3
    shared_roles: [employee, supplier]

coordination:             # группа координации (ревью E) — предложено
  roles: [employee, helper, supplier]
  window_days: 10         # как окно всплеска (Блок 3)
  min_applications: 8
  min_ratio_to_pace: 3    # во столько раз выше сглаженного обычного темпа роли
  prior_weight_windows: 2 # вес среднего темпа ролей того же вида (m-оценка)
  level: yellow           # группа сама не причина отказа: только направляет на проверку

model:                    # источник «модель» (ревью C) — предложено
  expected_typologies: {T1: [F1, F2], T4: [F2, F3]}   # Блок 3: F1 в Т1, F2 в Т1 и Т4, F3 в Т4
  yellow_probability: {F1: 0.2, F2: 0.2, F3: 0.2}
  loss_given_fraud: {online: 0.9, program: 0.6}       # оценочная доля невозвратной потери
  risk_appetite: 3000000  # сум: оценочная стоимость риска выше — красный
  top_contributions: 5    # сколько признаков показывать в причине

mandatory_rules:          # процесс останавливается по норме; узел только пишет факт
  - {code: MANDATORY_SELF_BAN, check: self_ban_active}
  - {code: MANDATORY_BUREAU_BLOCKED, check: bureau_blocked}
  - {code: MANDATORY_BIOMETRY_FAILED, check: biometry_failed}
  - {code: MANDATORY_PHONE_NOT_OWNED, check: phone_not_owned}

product_rules:            # минимальный уровень (Блок 4, «Сведение в уровни»)
  - {code: PRODUCT_CONFIRMED_CASE_IDENTIFIER, signal: confirmed_case_identifier, min_level: red}
  - {code: PRODUCT_CLIENT_REPORTED_PRESSURE, signal: client_reported_pressure, min_level: red}
  - {code: PRODUCT_PRICE_ABOVE_MARKET, signal: price_above_market, min_level: yellow}

actions:                  # действие по точке, типологии ведущей причины и уровню
  green: continue
  rules:
    - {point: T1, typology: F1, level: yellow, action: intent_check}
    - {point: T1, typology: F1, level: red, action: pause_for_call}
    - {point: T1, typology: F2, action: internal_review}
    - {point: T1, typology: F3, action: internal_review}
    - {point: T4, typology: F1, action: internal_review}
    - {point: T4, typology: F2, action: internal_review}
    - {point: T4, typology: F3, action: internal_review}
