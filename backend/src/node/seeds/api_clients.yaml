# Системы банка, которые ходят в узел. Ключи — только из окружения; права — по заметке 11 «Ядро».
api_clients:
  - name: bank-sim-conveyor
    scopes: [assessments]
    key_env: NODE_API_KEY_CONVEYOR
  - name: bank-sim-core-banking
    scopes: [permits, transfers]  # АБС и транзакционный антифрод: разрешения, итоги, рекомендация Т3
    key_env: NODE_API_KEY_CORE_BANKING
  - name: bank-sim-events
    scopes: [events]
    key_env: NODE_API_KEY_EVENTS
  - name: bank-sim-realms
    scopes: [realms]
    key_env: NODE_API_KEY_REALMS
  - name: bank-sim-history
    scopes: [history]           # прогон истории синтетического мира — только в общий мир
    key_env: NODE_API_KEY_HISTORY
  - name: network-operator
    scopes: [network]           # оператор сети кредиторов: уведомления о новых совпадениях (И4)
    key_env: NODE_API_KEY_NETWORK
