# Обучение и выпуск моделей. СТАТУС: предложено, ждёт согласования владельцем.
# Правка — новая версия файла; версия и параметры попадают в запись обучения каждой модели.
version: scoring-config-1
feature_set: fs-2

# По времени оценки внутри канала (Блок 3, «Валидация»). Строго: из обучения убирается всё, что связано с тестом
# через человека, телефон, устройство, адрес или дело, и все поставщики тестовых схем.
split: {train: 0.7, calibration: 0.1, test: 0.2}
weak_negative_weight: 0.3       # слабый негатив учит с меньшим весом (Блок 3, «Метки»)
min_positives: 10               # меньше позитивов в обучении — модель не выпускается
min_calibration_positives: 5    # меньше — калибровка по обучающей выборке с пометкой
review_share: 0.02              # рабочая доля ручной проверки: порог справедливости и нагрузки (Блок 3: 1–2 %)
review_shares: [0.01, 0.02]     # recall и precision при этих долях проверки — в отчёте
bootstrap_resamples: 1000       # 95 % доверительный интервал PR-AUC бутстрепом по тесту
point_in_time_sample: 1000      # сколько прошлых решений пересчитать из сегодняшней базы на их as_of
fpr: 0.05                       # recall при 5 % ложных тревог — для сравнения с BAF
age_bands: [30, 45, 60]         # predictive equality по возрасту: <30, 30–44, 45–59, 60+

lightgbm:
  objective: binary
  num_leaves: 15
  learning_rate: 0.05
  num_boost_round: 300
  min_data_in_leaf: 20
  feature_fraction: 0.9
  bagging_fraction: 0.8
  bagging_freq: 1
  seed: 20261011
  verbose: -1

models:                         # Блок 3: F1 в Т1, F2 в Т1 и Т4 с признаком канала, F3 в Т4
  - {name: f1-t1, typology: F1, points: [T1], groups: [context, zone1, zone2, zone3], calibrate_by_channel: false}
  - {name: f2, typology: F2, points: [T1, T4], groups: [context, zone1, zone2, zone3], calibrate_by_channel: true}
  - {name: f3-t4, typology: F3, points: [T4], groups: [context, zone2, zone3], calibrate_by_channel: false}
f2_mode: shared                 # shared | per_channel — по отчёту качества (ревью D)
