# Готовые сценарии трёх зон: шаги банка, которые имитатор выполняет в песочнице посетителя в один клик.
# Люди и компании генерируются заново на каждый запуск — детерминированно от песочницы и номера запуска,
# в форматах мира; повторный запуск не связывается с прошлым. expected — смысл сценария: уровень и действие
# считает узел по своей политике и моделям. Значения — предложено, ждут согласования с владельцем.
#
# Шаги:
#   facts       — ответы источников банка о людях (бюро, траты по картам, взносы ИНПС) событиями в узел;
#   company     — записи реестра юрлиц о компаниях сценария;
#   application — заявки через конвейер, по одной на человека: обязательные шаги № 3759 и оценка Т1/Т4.
#                 branch: online — приложение банка (заявка видна заёмщику), n — n-й филиал с сотрудниками,
#                 helper — филиал района помощника хокима; shared — общие телефон, устройство, адрес;
#                 session — что видел сессионный антифрод; program — помощник, поставщик, товар каталога мира
#                 и цена как множитель медианы рынка;
#   lender      — заявки людей сценария у кредитора Б или В: события активности в сеть кредиторов в контуре песочницы
#                 (minutes_ago — сколько минут назад подана, issued — выдан, transfer — первый перевод кредитных денег
#                 на общую карту сценария); у банка A этих заявок нет;
#   disbursement — АБС зачисляет кредит по разрешению узла (Т2);
#   transfer    — первый перевод доли зачисленного кредита на карту: ТАФ банка спрашивает рекомендацию узла (Т3).
# Сценарии с кредиторами Б и В показывают сеть: их уровень зависит от того, включена ли сеть в песочнице (включает
# риск-менеджер со вторым подписантом). Сценарий сам сеть не включает.
version: scenarios-2

scenarios:
  - code: honest_online
    zone: null
    title: Обычная онлайн-заявка
    summary: >-
      Клиент с привычным телефоном и ровными тратами берёт в приложении сумму по силам. Ничего, кроме
      обязательных шагов банка.
    expected: {level: green, action: continue}
    expected_summary: Зелёный за секунды, удержаний нет — АБС получит разрешение на зачисление.
    people:
      client: {birth_years: [1980, 1992], male: true}
    steps:
      - kind: facts
        people: [client]
        bureau: {active_loans: 1, closed_loans: 3}
        cards: {monthly_spending: 5000000, months: 6}
      - kind: application
        channel: online
        branch: online
        people: [client]
        loan: {amount: 6000000, term_months: 12}
        session: {device_age_days: 420, form_seconds: 240, pasted: false}

  - code: zone1_pressure
    zone: 1
    title: Давление на заёмщика
    summary: >-
      Пенсионерке звонят «из банка». Доступ к приложению восстановлен за двенадцать минут до заявки с нового
      устройства, звонок идёт прямо в сессии, форма заполнена вставкой за полминуты, сумма во много раз выше её
      трат, самозапрет снят два дня назад. Все обязательные шаги пройдены.
    expected: {level: red, action: pause_for_call}
    expected_summary: >-
      Красный — пауза до звонка аналитика по независимому номеру. В приложении — экран паузы без кнопки
      «продолжить»; снять паузу оттуда нельзя.
    people:
      victim: {birth_years: [1960, 1966], male: false}
    steps:
      - kind: facts
        people: [victim]
        bureau: {active_loans: 0, closed_loans: 3, self_ban_lifted_days_ago: 2}
        cards: {monthly_spending: 1800000, months: 6}
      - kind: application
        channel: online
        branch: online
        people: [victim]
        loan: {amount: 30000000, term_months: 24}
        session:
          device_age_days: 0
          access_recovered_minutes_before: 12
          call_in_progress: true
          form_seconds: 35
          pasted: true

  - code: zone1_intent_check
    zone: 1
    title: Нетипичная заявка — проверка намерения
    summary: >-
      Доступ восстановили за три часа до заявки, устройство новое, кредит — первый, сумма вчетверо выше
      обычных трат. Звонка и удалённого доступа нет: сигналы есть, но без явного давления.
    expected: {level: yellow, action: intent_check}
    expected_summary: >-
      Жёлтый — два вопроса в приложении, ответы кнопками. Верные ответы снимают удержание, тревожный ответ
      или «Меня просят взять кредит» ставят паузу до звонка.
    people:
      client: {birth_years: [1988, 1996], male: true}
    steps:
      - kind: facts
        people: [client]
        bureau: {active_loans: 0, closed_loans: 0}
        cards: {monthly_spending: 1500000, months: 6}
      - kind: application
        channel: online
        branch: online
        people: [client]
        loan: {amount: 6300000, term_months: 12}
        session: {device_age_days: 1, access_recovered_minutes_before: 180, form_seconds: 150, pasted: false}

  - code: zone2_second_branch
    zone: 2
    title: Связанная заявка во втором филиале
    summary: >-
      Два разных человека подают заявки в разных филиалах с одного телефона и одного устройства. Каждая
      по отдельности проходит все проверки.
    expected: {level: yellow, action: internal_review}
    expected_summary: >-
      Первая заявка зелёная. Вторая — жёлтый или красный с делом группы у внутреннего контроля; первая
      помечена «нужна новая оценка» и не получит разрешение на зачисление до пересчёта.
    people:
      first: {birth_years: [1975, 1990], male: true}
      second: {birth_years: [1985, 2000], male: false}
    steps:
      - kind: facts
        people: [first, second]
        bureau: {active_loans: 1, closed_loans: 2}
        cards: {monthly_spending: 6000000, months: 6}
      - kind: application
        channel: online
        branch: 1
        people: [first]
        shared: {phone: common_phone, device: common_device}
        loan: {amount: 8000000, term_months: 12}
      - kind: application
        channel: online
        branch: 2
        people: [second]
        shared: {phone: common_phone, device: common_device}
        loan: {amount: 8000000, term_months: 12}

  - code: zone2_ring
    zone: 2
    title: Кольцо заявок за день
    summary: >-
      Пять человек за день подают онлайн-заявки с одного устройства и одного адреса; все числятся у одного
      работодателя, зарегистрированного два месяца назад, и берут кредит впервые.
    expected: {level: red, action: internal_review}
    expected_summary: >-
      Независимые редкие связи и всплеск — дело группы у внутреннего контроля; удержание ставится на каждую
      заявку со своим основанием, ранние заявки кольца помечаются «нужна новая оценка».
    companies:
      employer: {role: employer, profile: {registered_days_ago: 60, headcount: 4}}
    people:
      r1: {birth_years: [1990, 2002], male: true, employer: employer}
      r2: {birth_years: [1990, 2002], male: false, employer: employer}
      r3: {birth_years: [1990, 2002], male: true, employer: employer}
      r4: {birth_years: [1990, 2002], male: true, employer: employer}
      r5: {birth_years: [1990, 2002], male: false, employer: employer}
    steps:
      - kind: company
        companies: [employer]
      - kind: facts
        people: [r1, r2, r3, r4, r5]
        bureau: {active_loans: 0, closed_loans: 0}
        cards: {monthly_spending: 3000000, months: 6}
      - kind: application
        channel: online
        branch: online
        people: [r1, r2, r3, r4, r5]
        shared: {device: ring_device, address: ring_address}
        loan: {amount: 10000000, term_months: 12}
        session: {device_age_days: 2, form_seconds: 70, pasted: true}

  - code: zone3_overpriced_livestock
    zone: 3
    title: Программный займ — цена вдвое выше рынка
    summary: >-
      Заявитель не из махалли помощника хокима покупает двух коров по цене вдвое выше рынка (медиана мира —
      12 млн сум за голову) у поставщика, зарегистрированного полтора месяца назад. Взносы в ИНПС за последние
      три месяца выросли втрое добровольными платежами.
    expected: {level: yellow, action: internal_review}
    expected_summary: >-
      Жёлтый или красный — дело внутреннему контролю: цена против сравнимых покупок, поставщик-новичок,
      заявитель не из махалли помощника, скачок дохода. Оплата поставщику (Т5) — только после проверки.
    companies:
      supplier: {role: supplier, profile: {registered_days_ago: 45, headcount: 2}}
    people:
      applicant: {birth_years: [1978, 1992], male: true, home: {helper: 1, mahalla: other}}
    steps:
      - kind: company
        companies: [supplier]
      - kind: facts
        people: [applicant]
        bureau: {active_loans: 0, closed_loans: 1}
        inps: {monthly: 4500, months: 15, jump: {months: 3, factor: 3.0, voluntary: true}}
      - kind: application
        channel: program
        branch: helper
        people: [applicant]
        loan: {term_months: 36}
        program: {helper: 1, supplier: supplier, item: cow, price_factor: 2.0, quantity: 2}

  - code: network_links_elsewhere
    zone: 2
    title: Связи у других банков
    summary: >-
      За последние дни в банках Б и В подали заявки два разных человека с одним телефоном и одним устройством.
      Теперь в банк A приходит третий человек с тем же телефоном и с того же устройства. У банка A своих связей
      по этой заявке нет.
    expected: {level: yellow, action: internal_review}
    expected_summary: >-
      С включённой сетью — жёлтый: телефон и устройство заявки у двух других людей в других банках — две
      независимые связи, дело группы у внутреннего контроля. Сеть выключена — зелёный: один банк этих связей не видит.
    people:
      first_elsewhere: {birth_years: [1975, 1990], male: true}
      second_elsewhere: {birth_years: [1985, 2000], male: false}
      client: {birth_years: [1980, 1995], male: true}
    steps:
      - kind: lender
        lender: B
        people: [first_elsewhere]
        shared: {phone: ring_phone, device: ring_device}
        minutes_ago: 2880
      - kind: lender
        lender: C
        people: [second_elsewhere]
        shared: {phone: ring_phone, device: ring_device}
        minutes_ago: 1440
      - kind: facts
        people: [client]
        bureau: {active_loans: 1, closed_loans: 2}
        cards: {monthly_spending: 6000000, months: 6}
      - kind: application
        channel: online
        branch: online
        people: [client]
        shared: {phone: ring_phone, device: ring_device}
        loan: {amount: 8000000, term_months: 12}
        session: {device_age_days: 300, form_seconds: 200, pasted: false}

  - code: network_pinfl_series
    zone: 1
    title: Серия по ПИНФЛ в разных банках
    summary: >-
      За последний час тот же человек подал заявки в банки Б и В — бюро ещё не заблокировало других кредиторов,
      выдачи не было. Теперь он подаёт заявку в банк A. По данным самого банка всё обычно.
    expected: {level: yellow, action: pause_for_call}
    expected_summary: >-
      С включённой сетью — жёлтый: заявки того же ПИНФЛ в двух других банках за час. Это независимое основание —
      спокойные ответы в приложении его не снимают, поэтому звонок аналитика. Сеть выключена — сигнала нет: серию
      видит только сеть.
    people:
      client: {birth_years: [1970, 1985], male: false}
    steps:
      - kind: lender
        lender: B
        people: [client]
        minutes_ago: 45
      - kind: lender
        lender: C
        people: [client]
        minutes_ago: 20
      - kind: facts
        people: [client]
        bureau: {active_loans: 1, closed_loans: 2}
        cards: {monthly_spending: 4000000, months: 6}
      - kind: application
        channel: online
        branch: online
        people: [client]
        loan: {amount: 7000000, term_months: 12}
        session: {device_age_days: 200, form_seconds: 180, pasted: false}

  - code: network_main
    zone: 2
    title: Главный сценарий через сеть
    summary: >-
      Обычная заявка в банке A проходит все проверки. Сразу после оценки в банке Б подаёт заявку другой человек
      с тем же телефоном и с того же устройства.
    expected: {level: green, action: continue}
    expected_summary: >-
      Заявка в банке A зелёная. С включённой сетью оператор через секунды сообщает узлу о новом совпадении: заявка
      помечается «нужна новая оценка», и АБС получит отказ в зачислении до пересчёта. Новая оценка — жёлтый
      с причинами сети, дело у внутреннего контроля. Сеть выключена — зачисление пройдёт: совпадение в другом банке
      узел не увидит.
    people:
      client: {birth_years: [1978, 1992], male: true}
      linked: {birth_years: [1985, 2000], male: true}
    steps:
      - kind: facts
        people: [client]
        bureau: {active_loans: 1, closed_loans: 3}
        cards: {monthly_spending: 6000000, months: 6}
      - kind: application
        channel: online
        branch: online
        people: [client]
        shared: {phone: common_phone, device: common_device}
        loan: {amount: 7000000, term_months: 12}
        session: {device_age_days: 400, form_seconds: 220, pasted: false}
      - kind: lender
        lender: B
        people: [linked]
        shared: {phone: common_phone, device: common_device}

  - code: network_card_transfer
    zone: 1
    title: Карта в сети — первый перевод
    summary: >-
      Заявка в банке A проходит, кредит зачислен. Первым же переводом почти весь кредит уходит на новую для клиента
      карту — на неё за последние дни уже приходили кредитные деньги заёмщиков банков Б и В.
    expected: {level: red, action: hold_until_confirmed}
    expected_summary: >-
      Заявка зелёная. С включённой сетью рекомендация на первом переводе (Т3) — удержать до подтверждения: карта
      связана с заёмщиками других банков. Сеть выключена — транзакционный антифрод решает по своим данным.
    people:
      client: {birth_years: [1958, 1966], male: false}
      first_borrower: {birth_years: [1960, 1970], male: true}
      second_borrower: {birth_years: [1955, 1968], male: false}
    steps:
      - kind: lender
        lender: B
        people: [first_borrower]
        minutes_ago: 4320
        issued: true
        transfer: {card: mule_card, credit_share: 0.9}
      - kind: lender
        lender: C
        people: [second_borrower]
        minutes_ago: 1440
        issued: true
        transfer: {card: mule_card, credit_share: 0.85}
      - kind: facts
        people: [client]
        bureau: {active_loans: 0, closed_loans: 2}
        cards: {monthly_spending: 3000000, months: 6}
      - kind: application
        channel: online
        branch: online
        people: [client]
        loan: {amount: 9000000, term_months: 12}
        session: {device_age_days: 500, form_seconds: 240, pasted: false}
      - kind: disbursement
        people: [client]
      - kind: transfer
        people: [client]
        card: mule_card
        credit_share: 0.8
