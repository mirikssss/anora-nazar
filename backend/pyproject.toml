[project]
name = "anora-nazar-backend"
version = "0.1.0"
description = "Anora Nazar: узел проверки заявок на кредит и окружение банка-пилота"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "httpx>=0.27",
    "lightgbm>=4.5",
    "numpy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pynacl>=1.5",
    "pyyaml>=6.0",
    "rfc8785>=0.1.4",
    "scikit-learn>=1.5",
    "sqlalchemy>=2.0.32",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared", "src/node", "src/bank_sim", "src/network_operator", "src/anchor", "src/world"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "ANN", "PL"]
ignore = ["RUF001", "RUF002", "RUF003", "PLR0913", "PLR0917", "PLR2004", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "PLR"]
"src/*/migrations/**" = ["ANN", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["shared", "node", "bank_sim", "anchor", "world"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["rfc8785.*", "nacl.*", "lightgbm.*", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
